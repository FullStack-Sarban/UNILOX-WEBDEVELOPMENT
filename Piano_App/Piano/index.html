<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        .piano {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .key {
            width: 60px;
            height: 200px;
            background-color: white;
            border: 1px solid black;
            margin: 0 5px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        }
        .key:hover {
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <h1>Piano - Event Topic</h1>
    <p>Click to play the notes</p>

    <div class="piano">
        <div class="key">C</div>
        <div class="key">D</div>
        <div class="key">E</div>
        <div class="key">F</div>
        <div class="key">G</div>
        <div class="key">A</div>
        <div class="key">B</div>
        <div class="key">c</div>

    </div>
    <audio src="freesound_community-c3-95007.mp3" class="audio-C"></audio>
    <audio src="freesound_community-re-78500.mp3" class="audio-D"></audio>
    <audio src="freesound_community-mi-80239.mp3" class="audio-E"></audio>
    <audio src="freesound_community-fa-78409.mp3" class="audio-F"></audio>
    <audio src="freesound_community-sol-101774.mp3" class="audio-G"></audio>
    <audio src="freesound_community-la-80237.mp3" class="audio-A"></audio>
    <audio src="freesound_community-si-80238.mp3" class="audio-B"></audio>
    <audio src="freesound_community-c6-102822.mp3" class="audio-c"></audio>

    <script>
        const keys = document.querySelectorAll('.key');
        keys.forEach(key => {
            key.addEventListener('click', () => {
                const note = key.textContent;
                const audio = document.querySelector(`.audio-${note}`);
                if (audio) {
                    audio.currentTime = 0; // Rewind to the start
                    audio.play();
                }
            });
        });
    </script>
</body>
</html>
