<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rock Paper Scissors - Epic Duel Arena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Main Game Container */
        .game-container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 3rem;
            padding: 2rem 1.5rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        h1 {
            text-align: center;
            font-size: 2.8rem;
            background: linear-gradient(135deg, #f5af19, #f12711, #f5af19);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            margin-bottom: 0.5rem;
            animation: shimmer 3s infinite linear;
        }

        @keyframes shimmer {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 200% 50%;
            }
        }

        .sub {
            text-align: center;
            color: #c4c4e0;
            margin-bottom: 1.8rem;
            font-weight: 500;
        }

        /* Scoreboard Arena */
        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .score-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 1rem 2rem;
            min-width: 180px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        .score-card h3 {
            color: #ffd966;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 3.5rem;
            font-weight: bold;
            color: #f5f5f5;
            text-shadow: 0 0 10px #ffaa33;
            line-height: 1;
        }

        .match-points {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 8px;
        }

        /* Battle Animation Arena */
        .battle-arena {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 2.5rem;
            padding: 2rem 1rem;
            margin: 1.5rem 0;
            min-height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
            position: relative;
            border: 1px dashed rgba(255, 255, 200, 0.3);
            transition: all 0.2s;
        }

        .fighter {
            flex: 1;
            min-width: 180px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 2rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .fighter-label {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #ffd966;
            text-transform: uppercase;
        }

        .icon-display {
            font-size: 6rem;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
            transition: transform 0.2s ease;
            display: inline-block;
        }

        .vs-divider {
            font-size: 2.5rem;
            font-weight: bold;
            background: rgba(255, 80, 40, 0.8);
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            text-shadow: 0 2px 5px black;
            box-shadow: 0 0 20px rgba(255, 50, 0, 0.7);
            font-family: monospace;
        }

        /* Animations */
        @keyframes rockShake {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            25% {
                transform: translateY(-20px) rotate(15deg);
            }

            50% {
                transform: translateY(10px) rotate(-15deg);
            }

            75% {
                transform: translateY(-10px) rotate(10deg);
            }

            100% {
                transform: translateY(0) rotate(0);
            }
        }

        @keyframes paperFloat {
            0% {
                transform: scale(1) translateX(0);
                opacity: 1;
            }

            50% {
                transform: scale(1.2) translateX(15px);
                opacity: 0.9;
            }

            100% {
                transform: scale(1) translateX(0);
            }
        }

        @keyframes scissorsSlice {
            0% {
                transform: rotate(0deg) scale(1);
            }

            30% {
                transform: rotate(25deg) scale(1.3);
            }

            70% {
                transform: rotate(-20deg) scale(1.2);
            }

            100% {
                transform: rotate(0deg) scale(1);
            }
        }

        @keyframes vanishFade {
            0% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                filter: blur(0px);
            }

            100% {
                opacity: 0;
                transform: scale(0.2) rotate(180deg);
                filter: blur(8px);
                visibility: hidden;
            }
        }

        .animate-rock {
            animation: rockShake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        .animate-paper {
            animation: paperFloat 0.5s ease-in-out both;
        }

        .animate-scissors {
            animation: scissorsSlice 0.5s ease both;
        }

        .vanish-effect {
            animation: vanishFade 0.6s forwards !important;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin: 2rem 0 1rem;
        }

        .game-btn {
            background: linear-gradient(145deg, #2c2c3a, #1e1e2a);
            border: none;
            padding: 1rem 2rem;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 4rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 0 #0f0f17;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .game-btn span {
            font-size: 2.2rem;
        }

        .game-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #0f0f17;
        }

        .game-btn:hover {
            background: linear-gradient(145deg, #3e3e52, #2a2a38);
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #0f0f17;
        }

        .reset-btn {
            background: linear-gradient(145deg, #5a2e2e, #3a1e1e);
            box-shadow: 0 8px 0 #2a1212;
            font-size: 1.2rem;
            padding: 0.8rem 1.8rem;
        }

        .winner-message {
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            margin-top: 1rem;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 3rem;
            color: gold;
        }

        .disabled-btn {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.2);
            transform: none !important;
        }

        footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #7a7a9a;
        }

        @media (max-width: 700px) {
            .icon-display {
                font-size: 4rem;
            }

            .vs-divider {
                width: 55px;
                height: 55px;
                font-size: 1.8rem;
            }

            .game-btn {
                padding: 0.7rem 1.3rem;
                font-size: 1.3rem;
            }

            .score-value {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="game-container">
        <h1>⚔️ ROCK PAPER SCISSORS ⚔️</h1>
        <div class="sub">★ FIRST TO 5 POINTS WINS THE DUEL ★</div>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score-card">
                <h3>👤 YOU</h3>
                <div class="score-value" id="userScore">0</div>
                <div class="match-points">/5</div>
            </div>
            <div class="score-card">
                <h3>🤖 COMPUTER</h3>
                <div class="score-value" id="computerScore">0</div>
                <div class="match-points">/5</div>
            </div>
        </div>

        <!-- Animated Battlefield -->
        <div class="battle-arena" id="battleArena">
            <div class="fighter" id="userFighter">
                <div class="fighter-label">⚡ YOUR MOVE ⚡</div>
                <div class="icon-display" id="userIcon">❔</div>
            </div>
            <div class="vs-divider">VS</div>
            <div class="fighter" id="computerFighter">
                <div class="fighter-label">💀 ENEMY 💀</div>
                <div class="icon-display" id="computerIcon">❔</div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons" id="choiceButtons">
            <button class="game-btn" id="rockBtn"><span>🪨</span> ROCK</button>
            <button class="game-btn" id="paperBtn"><span>📄</span> PAPER</button>
            <button class="game-btn" id="scissorsBtn"><span>✂️</span> SCISSORS</button>
        </div>

        <div style="display: flex; justify-content: center; margin-top: 0.5rem;">
            <button class="game-btn reset-btn" id="resetGameBtn">🔄 RESET MATCH</button>
        </div>

        <div id="roundResult" class="winner-message">✨ Choose your weapon! ✨</div>
        <footer>⚡ Insane animations • First to 5 points • Icons vanish after battle ⚡</footer>
    </div>

    <script>
        // ---------- GAME STATE ----------
        let userPoints = 0;
        let computerPoints = 0;
        let gameActive = true;          // becomes false if someone reaches 5
        let animationInProgress = false; // block clicks during vanish/animation
        let timeoutId = null;            // to clear vanish timers if reset happens

        // DOM Elements
        const userScoreEl = document.getElementById('userScore');
        const computerScoreEl = document.getElementById('computerScore');
        const userIconDiv = document.getElementById('userIcon');
        const computerIconDiv = document.getElementById('computerIcon');
        const roundResultDiv = document.getElementById('roundResult');
        const rockBtn = document.getElementById('rockBtn');
        const paperBtn = document.getElementById('paperBtn');
        const scissorsBtn = document.getElementById('scissorsBtn');
        const resetBtn = document.getElementById('resetGameBtn');
        const choiceButtonsContainer = document.getElementById('choiceButtons');
        const allActionBtns = [rockBtn, paperBtn, scissorsBtn];

        // Helper: Icon mapping (display & animation class mapping)
        function getIconAndAnim(choice) {
            const map = {
                rock: { icon: '🪨', animClass: 'animate-rock' },
                paper: { icon: '📄', animClass: 'animate-paper' },
                scissors: { icon: '✂️', animClass: 'animate-scissors' }
            };
            return map[choice] || { icon: '❓', animClass: '' };
        }

        // Clear existing vanish timeouts
        function clearVanishingTimer() {
            if (timeoutId) {
                clearTimeout(timeoutId);
                timeoutId = null;
            }
        }

        // Remove vanish classes and reset icons to default after vanish phase?
        function resetIconsToQuestionMark() {
            // Only reset if game is not in a transitional locked state? But safely.
            if (userIconDiv && computerIconDiv) {
                userIconDiv.textContent = '❔';
                computerIconDiv.textContent = '❔';
            }
            // Also remove any leftover animation classes
            userIconDiv.classList.remove('animate-rock', 'animate-paper', 'animate-scissors', 'vanish-effect');
            computerIconDiv.classList.remove('animate-rock', 'animate-paper', 'animate-scissors', 'vanish-effect');
        }

        // Apply animation to icon element based on choice
        function animateIcon(element, choice) {
            const { animClass } = getIconAndAnim(choice);
            if (animClass) {
                element.classList.remove('animate-rock', 'animate-paper', 'animate-scissors');
                // force reflow for smoother animation reset
                void element.offsetWidth;
                element.classList.add(animClass);
                // remove after animation ends to keep clean
                setTimeout(() => {
                    element.classList.remove(animClass);
                }, 500);
            }
        }

        // Vanish effect: both icons fade + spin and disappear, then reset after 0.6s to question marks
        function vanishIconsAndReset() {
            // add vanish class to both icons
            userIconDiv.classList.add('vanish-effect');
            computerIconDiv.classList.add('vanish-effect');

            // after vanish animation (0.6s), reset icons to question mark and remove vanish classes
            clearVanishingTimer();
            timeoutId = setTimeout(() => {
                userIconDiv.textContent = '❔';
                computerIconDiv.textContent = '❔';
                userIconDiv.classList.remove('vanish-effect');
                computerIconDiv.classList.remove('vanish-effect');
                userIconDiv.classList.remove('animate-rock', 'animate-paper', 'animate-scissors');
                computerIconDiv.classList.remove('animate-rock', 'animate-paper', 'animate-scissors');
                timeoutId = null;
                // after icons reset, unlock game actions
                animationInProgress = false;
                // Re-enable buttons if game is still active and no winner lock?
                if (gameActive) {
                    enableButtons(true);
                } else {
                    // if game ended due to winner, buttons stay disabled except reset
                    enableButtons(false);
                }
            }, 600);
        }

        // Disable/Enable choice buttons
        function enableButtons(enable) {
            allActionBtns.forEach(btn => {
                if (enable) {
                    btn.classList.remove('disabled-btn');
                    btn.disabled = false;
                } else {
                    btn.classList.add('disabled-btn');
                    btn.disabled = true;
                }
            });
        }

        // Update score UI
        function updateScoreUI() {
            userScoreEl.textContent = userPoints;
            computerScoreEl.textContent = computerPoints;
        }

        // Check for match winner (first to 5)
        function checkMatchWinner() {
            if (userPoints >= 5) {
                gameActive = false;
                roundResultDiv.innerHTML = "🏆🔥 YOU WON THE MATCH! 🔥🏆<br>🎉 CONGRATULATIONS! 🎉";
                enableButtons(false);
                return true;
            } else if (computerPoints >= 5) {
                gameActive = false;
                roundResultDiv.innerHTML = "💀🤖 COMPUTER WON THE MATCH! 🤖💀<br>😭 BETTER LUCK NEXT TIME! 😭";
                enableButtons(false);
                return true;
            }
            return false;
        }

        // Core game logic: play a round
        async function playRound(userChoice) {
            // block if game not active or animation in progress
            if (!gameActive || animationInProgress) return;

            // Lock UI and prevent multiple clicks
            animationInProgress = true;
            enableButtons(false);

            // Generate computer choice
            const choices = ['rock', 'paper', 'scissors'];
            const computerChoice = choices[Math.floor(Math.random() * 3)];

            // Get icons
            const userIconData = getIconAndAnim(userChoice);
            const computerIconData = getIconAndAnim(computerChoice);

            // Immediately display icons on battlefield (no vanish yet)
            userIconDiv.textContent = userIconData.icon;
            computerIconDiv.textContent = computerIconData.icon;

            // Apply entrance animations (shake, float, slice)
            animateIcon(userIconDiv, userChoice);
            animateIcon(computerIconDiv, computerChoice);

            // Determine round outcome
            let outcomeMsg = '';
            let roundWinner = null; // 'user', 'computer', 'tie'

            if (userChoice === computerChoice) {
                outcomeMsg = `🤝 TIE! Both chose ${userChoice.toUpperCase()} 🤝`;
                roundWinner = 'tie';
            } else if (
                (userChoice === 'rock' && computerChoice === 'scissors') ||
                (userChoice === 'paper' && computerChoice === 'rock') ||
                (userChoice === 'scissors' && computerChoice === 'paper')
            ) {
                outcomeMsg = `🎉 YOU WIN! ${userChoice.toUpperCase()} beats ${computerChoice.toUpperCase()} 🎉`;
                roundWinner = 'user';
                userPoints++;
            } else {
                outcomeMsg = `💔 YOU LOSE! ${computerChoice.toUpperCase()} beats ${userChoice.toUpperCase()} 💔`;
                roundWinner = 'computer';
                computerPoints++;
            }

            // Update scoreboard UI
            updateScoreUI();

            // Display round result temporarily before showing match winner checks
            roundResultDiv.innerHTML = outcomeMsg;

            // Check if match ends after updating points
            const matchEnded = checkMatchWinner();

            // If match ended, we show final message and do not vanish icons? but vanish effect still nice but we must reset later?
            // We still want vanish effect and then after vanish we ensure buttons are disabled.
            if (matchEnded) {
                // match ended, gameActive is false. Icons will vanish then reset to question marks, but buttons stay disabled.
                vanishIconsAndReset();
                // after vanish, gameActive false already, buttons disabled
                return;
            }

            // No match end: proceed vanish after 0.9 seconds (to see outcome + animation)
            // But the vanish should happen after a short delay to enjoy icons and result text
            // Also we need to clear any ongoing timer just in case.
            clearVanishingTimer();
            timeoutId = setTimeout(() => {
                // vanish both icons with dramatic effect
                userIconDiv.classList.add('vanish-effect');
                computerIconDiv.classList.add('vanish-effect');

                // after vanish, reset icons and re-enable buttons
                const vanishResetTimer = setTimeout(() => {
                    userIconDiv.textContent = '❔';
                    computerIconDiv.textContent = '❔';
                    userIconDiv.classList.remove('vanish-effect');
                    computerIconDiv.classList.remove('vanish-effect');
                    userIconDiv.classList.remove('animate-rock', 'animate-paper', 'animate-scissors');
                    computerIconDiv.classList.remove('animate-rock', 'animate-paper', 'animate-scissors');

                    // Unlock game for next round if still active
                    if (gameActive) {
                        animationInProgress = false;
                        enableButtons(true);
                    } else {
                        animationInProgress = false;
                        enableButtons(false);
                    }
                    clearVanishingTimer(); // clear reference
                    timeoutId = null;
                }, 600);
                timeoutId = vanishResetTimer;
            }, 900);
        }

        // Reset entire match (score 0-0, reactivate, reset icons, clear timeouts)
        function resetMatch() {
            // Cancel any ongoing vanish/anim timers
            clearVanishingTimer();
            if (timeoutId) {
                clearTimeout(timeoutId);
                timeoutId = null;
            }
            // Reset state
            userPoints = 0;
            computerPoints = 0;
            gameActive = true;
            animationInProgress = false;

            updateScoreUI();
            // Reset icons to question mark
            userIconDiv.textContent = '❔';
            computerIconDiv.textContent = '❔';
            // remove any leftover animation/vanish classes
            userIconDiv.classList.remove('animate-rock', 'animate-paper', 'animate-scissors', 'vanish-effect');
            computerIconDiv.classList.remove('animate-rock', 'animate-paper', 'animate-scissors', 'vanish-effect');

            // Reset result message
            roundResultDiv.innerHTML = "✨ Game Reset! First to 5 points! ✨";

            // Enable all buttons since game is active again
            enableButtons(true);
        }

        // Event binding with safety
        rockBtn.addEventListener('click', () => {
            if (!gameActive || animationInProgress) return;
            playRound('rock');
        });
        paperBtn.addEventListener('click', () => {
            if (!gameActive || animationInProgress) return;
            playRound('paper');
        });
        scissorsBtn.addEventListener('click', () => {
            if (!gameActive || animationInProgress) return;
            playRound('scissors');
        });

        resetBtn.addEventListener('click', () => {
            resetMatch();
        });

        // Initialize: enable buttons, game active, scores 0
        function init() {
            userPoints = 0;
            computerPoints = 0;
            gameActive = true;
            animationInProgress = false;
            updateScoreUI();
            enableButtons(true);
            resetIconsToQuestionMark();
            roundResultDiv.innerHTML = "⚔️ Choose your weapon! First to 5 points wins ⚔️";
            if (timeoutId) clearTimeout(timeoutId);
            timeoutId = null;
        }

        init();
    </script>
</body>

</html>
