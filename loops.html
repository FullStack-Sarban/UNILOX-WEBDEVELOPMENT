<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // for loop
        // 1 to 10
        for (let i = 0; i <= 10; i++) {
            console.log(i);
        }
        // 10 to 1
        for (let i = 10; i >= 1; i--) {
            console.log(i);
        }

        // while loop
        let count = 1;
        while (count <= 10) {
            console.log(count);
            count++;
        }

        // do while loop
        let num = 1;
        do {
            console.log("num");
            num++;
        } while (num <= 1);

    </script>
</body>
</html>
