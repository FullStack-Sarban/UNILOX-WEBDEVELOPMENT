
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let luckyNumber = Math.floor(Math.random() * 6) + 1;
        
        while (true) {
            let userGuess = prompt("Guess a number between 1 and 6");
            if (userGuess === luckyNumber) {
                alert("Congratulations! You guessed the lucky number!");
                break;
            } else {
                alert("Wrong guess! Try again.");
            }
        }
    </script>
</body>
</html>
