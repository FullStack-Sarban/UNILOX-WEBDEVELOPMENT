<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // session storage acts like temporary storage for the browser, it can store large amount of data - eg : username, password, email, etc
        // session storage is stored in the browser and is not sent to the server with every request.
        // session storage is cleared when the browser tab is closed.

        sessionStorage.setItem("cart", [' apple', 'banana', 'orange']);
        sessionStorage.setItem("Cart2", JSON.stringify([' apple', 'banana', 'orange'])); // we need to stringify the array before storing it in session storage
    </script>
</body>
</html>
