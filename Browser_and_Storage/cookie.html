<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Cookie will store small amount of date - eg : username, password, email, etc
        // Cookie is stored in the browser and sent to the server with every request
        // Cookie has an expiry date - if not set, it will be deleted when the browser is closed

        document.cookie = "username=John Doe; expires=Fri, 31 Dec 2026 23:59:59 UTC;";
        document.cookie = "email=john.doe@example.com; expires=Fri, 31 Dec 2026 23:59:59 UTC;";
    </script>
</body>
</html>
